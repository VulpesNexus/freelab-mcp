[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "freelab-mcp"
version = "0.1.0"
description = "MCP server for FontLab, through the FreeLab listener that runs inside FontLab"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2"]

[project.scripts]
freelab-mcp = "freelab_mcp.server:main"

[tool.setuptools]
packages = ["freelab_mcp"]
