[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "freelab-mcp"
version = "0.1.0"
description = "MCP server for FontLab, through the FreeLab listener that runs inside FontLab"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = ["mcp>=1.2,<2"]  # written for the 1.x API (2.x renamed the server class)

[project.scripts]
freelab-mcp = "freelab_mcp.server:main"

[tool.setuptools]
packages = ["freelab_mcp"]
